name: Build & Release

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
      - "plugin-v*"
      - "chatgpt2api-cpa-plugin-v*"
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v (e.g. 0.2.0). Empty = no GitHub Release."
        required: false
        default: ""
      prerelease:
        description: "Mark GitHub Release as prerelease"
        type: boolean
        default: false

env:
  PLUGIN_ID: chatgpt2api-cpa-plugin
  GO_VERSION: "1.22.x"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: .so
            asset_os: linux
            asset_arch: amd64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            ext: .so
            asset_os: linux
            asset_arch: arm64
          - name: windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            ext: .dll
            asset_os: windows
            asset_arch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          V=""
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            V="${GITHUB_REF_NAME}"
            V="${V#chatgpt2api-cpa-plugin-}"
            V="${V#plugin-}"
            V="${V#v}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            V="${{ github.event.inputs.version }}"
            V="${V#v}"
          fi
          if [[ -z "$V" ]]; then
            V="0.0.0-sha.${GITHUB_SHA::7}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $V"

      - name: Build shared library
        shell: bash
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
          PLUGIN_ID: ${{ env.PLUGIN_ID }}
        run: |
          set -euo pipefail
          OUT="${PLUGIN_ID}${EXT}"
          go mod tidy
          go build -buildmode=c-shared \
            -ldflags "-s -w -X main.pluginVersion=${{ steps.ver.outputs.version }}" \
            -o "${OUT}" .
          ls -la "${OUT}"*

      - name: Package CPA plugin zip
        shell: bash
        env:
          EXT: ${{ matrix.ext }}
          ASSET_OS: ${{ matrix.asset_os }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          LIB="${PLUGIN_ID}${EXT}"
          test -f "$LIB"
          ZIP_NAME="${PLUGIN_ID}_${VERSION}_${ASSET_OS}_${ASSET_ARCH}.zip"
          if command -v zip >/dev/null 2>&1; then
            zip -9 "dist/${ZIP_NAME}" "${LIB}"
          elif command -v powershell.exe >/dev/null 2>&1 || command -v powershell >/dev/null 2>&1; then
            PS=powershell
            command -v powershell.exe >/dev/null 2>&1 && PS=powershell.exe
            $PS -NoProfile -Command "Compress-Archive -Path '${LIB}' -DestinationPath 'dist/${ZIP_NAME}' -Force"
          else
            tar -a -cf "dist/${ZIP_NAME}" "${LIB}"
          fi
          mkdir -p "dist/layout/${ASSET_OS}/${ASSET_ARCH}"
          cp "$LIB" "dist/layout/${ASSET_OS}/${ASSET_ARCH}/${PLUGIN_ID}${EXT}"
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN_ID }}-${{ matrix.name }}
          path: |
            dist/${{ env.PLUGIN_ID }}_*.zip
            dist/layout/**
          if-no-files-found: error

  release:
    name: Auto GitHub Release
    needs: build
    if: |
      always() &&
      needs.build.result == 'success' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/plugin-v')) ||
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/chatgpt2api-cpa-plugin-v')) ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve release meta
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            V="${TAG}"
            V="${V#chatgpt2api-cpa-plugin-}"
            V="${V#plugin-}"
            V="${V#v}"
          else
            V="${{ github.event.inputs.version }}"
            V="${V#v}"
            TAG="v${V}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=${{ github.event.inputs.prerelease || false }}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect zips and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f -name '*.zip' -exec cp {} release/ \;
          cd release
          test -n "$(ls -A *.zip 2>/dev/null)" || { echo "no zip artifacts"; exit 1; }
          sha256sum *.zip > checksums.txt
          ls -la
          cat checksums.txt

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: chatgpt2api-cpa-plugin ${{ steps.meta.outputs.version }}
          body: |
            ## chatgpt2api-cpa-plugin `${{ steps.meta.outputs.version }}`

            CPA store assets:

            - `chatgpt2api-cpa-plugin_${{ steps.meta.outputs.version }}_<goos>_<goarch>.zip`
            - `checksums.txt`

            Repo: https://github.com/LinkVibe/chatgpt2api-cpa-plugin
          files: |
            release/*.zip
            release/checksums.txt
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
